<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Météo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Cinzel:wght@500;700&family=MedievalSharp&family=VT323&family=Orbitron:wght@500;700&family=Press+Start+2P&family=Special+Elite&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=UnifrakturMaguntia&family=Creepster&family=Bangers&family=Caveat:wght@500;700&family=Gochi+Hand&family=Rye&family=Poiret+One&family=Limelight&family=Monoton&family=Audiowide&family=Share+Tech+Mono&family=Silkscreen&family=Fredoka:wght@400;600&family=Architects+Daughter&family=Mountains+of+Christmas:wght@700&family=Oswald:wght@400;600&family=Comic+Neue:wght@700&family=IM+Fell+English:ital@0;1&family=Tilt+Neon&family=Dela+Gothic+One&family=Noto+Serif+JP:wght@900&family=JetBrains+Mono:wght@400;700&family=Shippori+Mincho+B1:wght@800&family=Yuji+Syuku&family=Bodoni+Moda:ital,wght@1,900&family=Nunito:wght@600;800;900&display=swap">
<style>
:root{--fg:#fff;--glass:rgba(255,255,255,.16);--line:rgba(255,255,255,.3)}
[data-w=snow]{--fg:#18283a;--glass:rgba(255,255,255,.45);--line:rgba(255,255,255,.75)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#stage{position:absolute;left:0;top:0;width:800px;height:480px;transform-origin:0 0;overflow:hidden;color:var(--fg);transition:color .8s}
.bg{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease;background-size:cover}
.bg.on{opacity:1}
.bg.anim{background-size:100% 240%!important;animation:bgpan 26s ease-in-out infinite alternate}
@keyframes bgpan{from{background-position:50% 0}to{background-position:50% 100%}}
canvas#fx,#fl{position:absolute;inset:0;pointer-events:none}
#fl{background:#fff;opacity:0}
#deco,#deco2,#under,#shelf,#eggs{position:absolute;inset:0;pointer-events:none}
#deco>*,#deco2>*,#under>*,#shelf>*,#eggs>*{position:absolute}
#deco2{z-index:2400}
#shelf{z-index:60}
#eggs{z-index:2700;overflow:hidden}
.glass{background:var(--glass);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.35);border-radius:26px}
header{position:absolute;left:28px;right:28px;top:20px;height:40px;display:flex;justify-content:space-between;align-items:center}
#city{font-size:15px;font-weight:600}
#date{font-size:13px;opacity:.8;margin-top:2px}
.tabs{display:flex;padding:3px;border-radius:20px}
.tabs button{padding:7px 18px;border-radius:17px;font-size:14px;font-weight:600;opacity:.75;transition:.25s}
.tabs button.on{background:rgba(255,255,255,.3);opacity:1}
[data-w=snow] .tabs button.on{background:rgba(255,255,255,.8)}
.view{position:absolute;left:28px;right:28px;top:84px;bottom:24px;opacity:0;pointer-events:none;transition:opacity .4s}
.view.on{opacity:1;pointer-events:auto}
#now{position:absolute;left:0;top:0;width:430px}
#temp{font-size:110px;font-weight:200;line-height:1;letter-spacing:-.04em;margin-top:6px}
#desc{font-size:22px;font-weight:500;margin-top:4px}
#hl{font-size:16px;font-weight:500;margin-top:8px;opacity:.9}
#mt{font-size:14px;margin-top:6px;opacity:.75}
#al{font-size:14px;font-weight:600;margin-top:10px;min-height:18px;color:#ffd25a}
[data-w=snow] #al{color:#a35a00}
#kick{display:none;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px}
#kick.on{display:block}
#days{position:absolute;right:0;top:0;width:290px}
.day{display:flex;align-items:center;height:46px;border-bottom:1px solid var(--line);font-size:16px;font-weight:600}
.day:last-child{border:0}
.day>span:first-child{width:62px;text-transform:capitalize}
.mm{display:flex;align-items:baseline}
.day .ico{margin-right:auto}
.day i{font-style:normal;opacity:.65;margin-left:12px;font-weight:500}
#hours{position:absolute;left:0;right:0;bottom:0;height:90px;display:flex;padding:10px 8px}
.h{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:15px;font-weight:600}
.h small{font-size:12px;font-weight:500;opacity:.75}
svg{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
svg.px,svg.duo{stroke:none}
.ico{display:inline-flex;align-items:center;justify-content:center;line-height:1;flex:none}
.ico svg{display:block}
.ico.gl{font-family:"Segoe UI Symbol","DejaVu Sans","Noto Sans Symbols2","Noto Sans Symbols",sans-serif;font-style:normal;font-weight:400}
pre.asc{font:inherit;line-height:1.02;white-space:pre;text-align:left;margin:0 0 4px}
#v2{overflow:hidden;color:#fff}
#map{position:absolute;inset:0;background:#0d1b2a;z-index:0}
.pill{position:absolute;z-index:1100;display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:22px;font-size:12px;font-weight:600;background:rgba(14,24,40,.62);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#leg{left:14px;top:14px;height:34px}
#leg b{width:70px;height:6px;border-radius:3px}
#ctl{left:14px;right:14px;bottom:26px;height:48px;font-size:13px}
#ctl input{flex:1;accent-color:#fff}
#tl{min-width:118px;text-align:right;white-space:nowrap}
.chip{padding:6px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.3);opacity:.55;font-size:12px;font-weight:600}
.chip.on{opacity:1;background:rgba(255,255,255,.22)}
.leaflet-container{font-family:inherit;background:#0d1b2a}
.leaflet-bar a{background:rgba(14,24,40,.72)!important;color:#fff!important;border-color:rgba(255,255,255,.18)!important}
.leaflet-top.leaflet-right{margin:8px 4px 0 0}
.leaflet-control-attribution{background:rgba(0,0,0,.5)!important;color:rgba(255,255,255,.7)!important;font-size:9px!important}
.leaflet-control-attribution a{color:#cfe3ff!important}
.osmdark{filter:invert(1) hue-rotate(180deg) brightness(.8) contrast(.9) saturate(.5)}
.me{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #1c6be6;animation:pu 2s infinite}
@keyframes pu{from{box-shadow:0 0 0 0 rgba(255,255,255,.7)}to{box-shadow:0 0 0 22px rgba(255,255,255,0)}}
.tt{background:rgba(14,24,40,.8);color:#fff;border:0;border-radius:10px;font-size:11px;font-weight:600;box-shadow:none}
.tt:before{display:none}
#v3{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:104px;gap:12px;overflow:auto;align-content:start}
.wg{padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;min-height:104px;overflow:hidden}
.wg .l{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.wg .v{font-size:34px;font-weight:300;line-height:1.1;word-break:break-word}
.wg .v.sm{font-size:16px;font-weight:500;line-height:1.35}
.wg img{max-width:100%;max-height:150px;object-fit:contain;margin-top:6px;align-self:center;border-radius:12px}
#empty{grid-column:1/-1;text-align:center;opacity:.75;font-size:14px;padding-top:60px}
#tick{position:absolute;left:28px;right:28px;bottom:14px;height:28px;overflow:hidden;display:none;border-radius:14px}
.tk #tick{display:block}
#tick span{position:absolute;white-space:nowrap;font-size:14px;font-weight:600;line-height:28px;animation:mq 22s linear infinite}
@keyframes mq{from{transform:translateX(760px)}to{transform:translateX(-100%)}}
#pair{position:absolute;left:28px;bottom:4px;z-index:3000;padding:3px 12px;font-size:11px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .4s;border-radius:12px}
#pair.on{opacity:.9}
#fest{position:absolute;left:50%;bottom:3px;transform:translateX(-50%);z-index:5;padding:2px 14px;font-size:12px;line-height:17px;font-weight:600;border-radius:16px;display:none;white-space:nowrap;transition:opacity .4s}
#fest.fade{opacity:0}
.tk #fest{bottom:auto;top:3px}
.wg iframe{width:100%;border:0;border-radius:12px;margin-top:6px;background:#fff}
.wg a{color:inherit}
#note{position:absolute;left:50%;top:14px;z-index:3000;transform:translate(-50%,-160%);max-width:640px;padding:12px 22px;font-size:16px;font-weight:600;text-align:center;opacity:0;visibility:hidden;pointer-events:none;transition:transform .5s cubic-bezier(.2,.9,.3,1.2),opacity .3s,visibility 0s .5s}
#note.on{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .5s cubic-bezier(.2,.9,.3,1.2),opacity .2s,visibility 0s}
.pv .tabs,.pv #v2,.pv #v3,.pv #pair,.pv #note{display:none!important}
/* ===== Styles « simples » : variables (valeurs par défaut = iOS) ===== */
#stage{font-family:var(--font,-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif)}
#ovb,#ovt{position:absolute;inset:0;pointer-events:none}
#ovb{background:var(--bgo,none)}
#ovt{z-index:2500;background:var(--top,none);background-size:var(--tops,auto)}
.glass{border-style:var(--bs,solid);border-width:var(--bw,1px);border-radius:var(--r,26px);box-shadow:var(--sh,inset 0 1px 0 rgba(255,255,255,.35));backdrop-filter:blur(var(--blur,26px)) saturate(170%);-webkit-backdrop-filter:blur(var(--blur,26px)) saturate(170%)}
.tabs{border-radius:var(--rt,20px)}
.tabs button{border-radius:var(--rb,17px)}
#stage .tabs button.on{background:var(--tabon,rgba(255,255,255,.3));color:var(--tabtx,var(--fg))}
#stage[data-w=snow] .tabs button.on{background:var(--tabon,rgba(255,255,255,.8))}
#temp{font-family:var(--tf);font-weight:var(--tw,200);letter-spacing:var(--tl,-.04em);text-shadow:var(--tsh,none)}
.h span,.day span,#hl,#mt,.wg .v{font-family:var(--nf)}
.wg .l{font-family:var(--lf);text-transform:var(--lc,uppercase);letter-spacing:var(--ll,.06em);color:var(--lcol)}
.h small{text-transform:var(--lc2,none);letter-spacing:var(--ll2,0);color:var(--lcol)}
.day>span:first-child{text-transform:var(--lc2,capitalize);color:var(--lcol)}
.pill{border-color:var(--pl,rgba(255,255,255,.22))}
.c-cor .tabs,.c-cor .wg{position:relative}
.c-cor .glass:before,.c-cor .glass:after{content:"";position:absolute;width:9px;height:9px;border:2px solid var(--ac);pointer-events:none}
.c-cor .glass:before{left:-1px;top:-1px;border-right:0;border-bottom:0}
.c-cor .glass:after{right:-1px;bottom:-1px;border-left:0;border-top:0}
/* ===== Disposition : jours en ligne ===== */
#days.row{display:flex;gap:8px}
#days.row .day{flex:1;flex-direction:column;justify-content:center;gap:3px;height:100%;font-size:14px;border-radius:18px}
#days.row .day>span:first-child{width:auto}
#days.row .day .ico{margin:0}
#days.row .mm i{margin-left:8px}
.pnl{padding:4px 16px}
#scan{position:absolute;inset:0;pointer-events:none;display:none}
#now.cp #ic,#now.cp #temp{display:inline-block;vertical-align:middle}
#now.cp #ic{margin-right:12px}
#now.cp #al{min-height:0;margin-top:4px}
/* ===== Rendus spéciaux de la température ===== */
#temp .seg{height:1em;width:auto;display:inline-block;vertical-align:top}
#temp svg.gz{width:1.62em;height:1.62em;display:block;stroke:none}
.flap{display:inline-flex;flex-wrap:wrap;gap:.07em .05em;perspective:400px}
.flap b{display:inline-block;min-width:.66em;height:1.08em;line-height:1.08em;text-align:center;font-weight:600;background:linear-gradient(#2c2c2c 0 49%,#0a0a0a 49% 52%,#262626 52%);color:#f4f4f4;border-radius:.07em;box-shadow:inset 0 1px rgba(255,255,255,.1),0 .03em .05em rgba(0,0,0,.7);padding:0 .04em;transform-origin:50% 50%}
.flap b.sp{background:none;box-shadow:none;min-width:.3em}
.flap b.fl{animation:flip .55s cubic-bezier(.3,.6,.4,1) both}
@keyframes flip{0%{transform:rotateX(0)}45%{transform:rotateX(88deg);filter:brightness(.4)}55%{transform:rotateX(-88deg);filter:brightness(.4)}100%{transform:rotateX(0)}}
.bar{display:inline-block;vertical-align:middle;width:64px;height:9px;border:2px solid currentColor;margin:0 6px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:#6dff8a;margin:0!important;opacity:1!important}
/* Radar fluide : pas de flou ni de transition sur la carte */
#v2,.pill{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.pill{background:rgba(14,24,40,.85)!important}
/* Mode léger (Raspberry Pi) : plus de flou, cartes plus opaques */
.lite .glass{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:rgba(20,30,50,.38)}
.lite[data-w=snow] .glass{background:rgba(255,255,255,.55)}
/* =====================================================================
   THÈMES « SIGNATURE » : chacun a sa déco, ses polices, son rendu
   de la température, ses icônes et ses propres textes.
   ===================================================================== */
#stage.sig #v2{color:#fff;text-shadow:none}
[data-w=snow],#stage[data-hud=minimal],#stage[data-hud=gazette],#stage[data-hud=cahier],#stage[data-hud=win95]{--moon:currentColor}
#stage[data-hud=medieval] .pnl,#stage[data-hud=medieval] #hours,#stage[data-hud=western] #now{--moon:currentColor}
#now.g{display:grid;grid-template-columns:auto 1fr;column-gap:18px;grid-template-areas:"k k" "t i" "t d" "t h" "t m" "a a";align-items:center}
#now.g #kick{grid-area:k}#now.g #temp{grid-area:t}#now.g #ic{grid-area:i}#now.g #desc{grid-area:d}#now.g #hl{grid-area:h}#now.g #mt{grid-area:m}#now.g #al{grid-area:a}
#now.g #ic{justify-self:start}
.gz .nd{transition:transform 1.8s cubic-bezier(.34,1.5,.64,1);transform-origin:100px 100px}
.gz .pr{transition:stroke-dasharray 1.6s ease}
.gz .spin{animation:spin 30s linear infinite;transform-origin:100px 100px}
.gz .spin2{animation:spin 18s linear infinite reverse;transform-origin:100px 100px}
@keyframes spin{to{transform:rotate(360deg)}}
svg.seg{stroke:none;overflow:visible}
svg.seg .off{opacity:.08}

/* ---------- CYBERPUNK ---------- */
#stage[data-hud=cyber]{--fg:#e6fbff;--glass:rgba(9,7,24,.82);--line:rgba(2,215,242,.35);--ac:#fcee0a;font-family:Rajdhani,"Arial Narrow","DejaVu Sans Condensed",sans-serif}
#stage[data-hud=cyber] .bg{filter:brightness(.36) saturate(1.8) hue-rotate(-15deg) contrast(1.2)}
#stage[data-hud=cyber] #scan{display:block;background:repeating-linear-gradient(0deg,rgba(0,0,0,.32) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 45%,rgba(255,0,60,.22))}
#stage[data-hud=cyber] .glass,#stage[data-hud=cyber] .pnl{border:0;border-radius:0;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));background:linear-gradient(90deg,#fcee0a 0 3px,transparent 3px),linear-gradient(#02d7f2,#02d7f2) 0 0/100% 1px no-repeat,linear-gradient(#02d7f2,#02d7f2) 0 100%/100% 1px no-repeat,linear-gradient(135deg,rgba(2,215,242,.16),transparent 45%),var(--glass)}
#stage[data-hud=cyber] .tabs{background:none;clip-path:none;gap:8px;padding:0 6px}
#stage[data-hud=cyber] .tabs button{transform:skewX(-18deg);border:1px solid #02d7f2;border-radius:0;text-transform:uppercase;letter-spacing:.14em;font-weight:700;padding:6px 16px;background:rgba(2,215,242,.08);opacity:1}
#stage[data-hud=cyber] .tabs button.on{background:#fcee0a;color:#0a0a0a;border-color:#fcee0a;box-shadow:4px 4px 0 #ff003c}
#stage[data-hud=cyber] #city{text-transform:uppercase;letter-spacing:.18em;color:#fcee0a;font-weight:700;font-size:16px}
#stage[data-hud=cyber] #city::before{content:"▮▮ ";color:#ff003c}
#stage[data-hud=cyber] #date{font-family:"Share Tech Mono",monospace;color:#02d7f2;letter-spacing:.05em;font-size:12px;opacity:1}
#stage[data-hud=cyber] #kick{color:#02d7f2;font-family:"Share Tech Mono",monospace;font-weight:400;font-size:11px;letter-spacing:.08em}
#stage[data-hud=cyber] #temp{font-weight:700;color:#fff;letter-spacing:-.02em;text-shadow:3px 0 rgba(255,0,60,.85),-3px 0 rgba(2,215,242,.85),0 0 22px rgba(2,215,242,.5);animation:glitch 6s infinite}
@keyframes glitch{0%,90%,100%{transform:none;clip-path:none}91%{transform:translateX(-6px);clip-path:inset(10% 0 55% 0)}93%{transform:translateX(6px) skewX(-8deg);clip-path:inset(60% 0 8% 0)}95%{transform:translateX(-2px);clip-path:none}}
#stage[data-hud=cyber] #desc{display:table;background:#fcee0a;color:#0a0a0a;padding:2px 24px 0 12px;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:19px}
#stage[data-hud=cyber] #hl,#stage[data-hud=cyber] #mt{font-family:"Share Tech Mono",monospace;color:#7df9ff;letter-spacing:.04em;opacity:1}
#stage[data-hud=cyber] #hl{color:#fcee0a;margin-top:10px}
#stage[data-hud=cyber] #al{color:#ff003c;text-shadow:0 0 8px #ff003c}
#stage[data-hud=cyber] #ic svg{color:#fcee0a;filter:drop-shadow(0 0 6px #fcee0a)}
#stage[data-hud=cyber] .day svg,#stage[data-hud=cyber] .h svg{color:#02d7f2;filter:drop-shadow(0 0 4px #02d7f2)}
#stage[data-hud=cyber] .day{text-transform:uppercase;letter-spacing:.08em;border-bottom:1px dashed rgba(2,215,242,.3)}
#stage[data-hud=cyber] .day>span:first-child{color:#fcee0a}
#stage[data-hud=cyber] .day i,#stage[data-hud=cyber] .h small{color:#ff4da6;opacity:1}
#stage[data-hud=cyber] #fest{color:#0a0a0a;background:#fcee0a;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);letter-spacing:.1em;text-transform:uppercase}
.cy-hex{left:7px;top:96px;writing-mode:vertical-rl;font:9px/1 "Share Tech Mono",monospace;color:rgba(2,215,242,.55);letter-spacing:.22em}
.cy-warn{left:28px;bottom:7px;width:150px;height:8px;background:repeating-linear-gradient(-45deg,#fcee0a 0 6px,#0a0a0a 6px 12px)}
.cy-warn::after{content:"ZONE MÉTÉO // ACCÈS AUTORISÉ";position:absolute;left:160px;top:-2px;white-space:nowrap;font:9px/12px "Share Tech Mono",monospace;color:#fcee0a;letter-spacing:.1em}
.cy-bar{right:28px;bottom:5px;width:120px;height:12px;background:repeating-linear-gradient(90deg,#02d7f2 0 2px,transparent 2px 4px,#02d7f2 4px 5px,transparent 5px 8px,#02d7f2 8px 11px,transparent 11px 13px)}
.cy-gl{left:0;right:0;height:14px;opacity:0;mix-blend-mode:screen}
.cy-gl.a{top:150px;background:rgba(255,0,60,.5);animation:cygl 7s infinite}
.cy-gl.b{top:300px;height:6px;background:rgba(2,215,242,.6);animation:cygl 11s 2s infinite}
.cy-gl.c{top:62px;height:3px;background:rgba(252,238,10,.7);animation:cygl 13s 5s infinite}
@keyframes cygl{0%,96%,100%{opacity:0;transform:none}97%{opacity:1;transform:translateX(-30px)}98.5%{opacity:.6;transform:translateX(40px)}}
.cy-cor{width:26px;height:26px;border:2px solid #fcee0a}
.cy-cor.tl{left:7px;top:7px;border-right:0;border-bottom:0}
.cy-cor.br{right:7px;bottom:7px;border-left:0;border-top:0}

/* ---------- MÉDIÉVAL (grimoire) ---------- */
#stage[data-hud=medieval]{--fg:#f6e7c1;--glass:#e4cf9c;--line:rgba(90,56,18,.35);font-family:"IM Fell English","MedievalSharp",Georgia,"DejaVu Serif",serif}
#stage[data-hud=medieval] .bg{filter:sepia(.6) saturate(.9) brightness(.6) contrast(1.05)}
#stage[data-hud=medieval] #fx{filter:sepia(.5)}

/* ===================================================================
   👁 LA PRÉSENCE — caméra de surveillance d'un couloir, la nuit.
   Quelqu'un se tient au bout. À chaque coupure de courant, il est plus près.
   (Le jumpscare n'existe que dans l'animation d'activation.)
   =================================================================== */
const PRV = {vx: 400, vy: 206, F: 250, fl: -.85, ce: 1.05, w: 1.15, zf: 12};
const prP = (X, Y, z) => [PRV.vx + X * PRV.F / z, PRV.vy - Y * PRV.F / z];
let PRX = {d: 0, next: 0, off: 0, offUntil: 0, gone: false, glitch: 0, cam: 3};
/* le couloir, en caméra de surveillance (niveaux de gris verdâtres) */
function prCorridor(g, t, o = {}) {
  const lit = o.lit == null ? 1 : o.lit, {w, fl, ce, zf} = PRV, Z0 = .55;
  const q = (pts, c) => { g.fillStyle = c; g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); g.fill(); };
  g.fillStyle = '#050605'; g.fillRect(0, 0, 800, 480);
  const L = v => `rgb(${(v * 1.0) | 0},${(v * 1.08) | 0},${(v * 1.0) | 0})`;
  /* sol, plafond, murs (dégradé de lumière vers le fond) */
  const steps = 14;
  for (let k = 0; k < steps; k++) { const z1 = Z0 * Math.pow(zf / Z0, k / steps), z2 = Z0 * Math.pow(zf / Z0, (k + 1) / steps), fade = Math.pow(1 - k / steps, 1.4) * lit + .04;
    q([prP(-w, fl, z1), prP(w, fl, z1), prP(w, fl, z2), prP(-w, fl, z2)], L(18 + 70 * fade));
    q([prP(-w, ce, z1), prP(w, ce, z1), prP(w, ce, z2), prP(-w, ce, z2)], L(10 + 34 * fade));
    q([prP(-w, fl, z1), prP(-w, ce, z1), prP(-w, ce, z2), prP(-w, fl, z2)], L(14 + 52 * fade));
    q([prP(w, fl, z1), prP(w, ce, z1), prP(w, ce, z2), prP(w, fl, z2)], L(12 + 48 * fade)); }
  /* carrelage */
  g.strokeStyle = `rgba(0,0,0,${(.25 * lit + .1).toFixed(2)})`; g.lineWidth = 1; g.beginPath();
  for (let i = -3; i <= 3; i++) { const a = prP(i / 3 * w, fl, Z0), b = prP(i / 3 * w, fl, zf); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); }
  for (let z = 1; z < zf; z *= 1.28) { const a = prP(-w, fl, z), b = prP(w, fl, z); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); } g.stroke();
  /* portes de classe avec leur petite vitre */
  [2.2, 4.3, 6.6, 9].forEach((z, i) => [-1, 1].forEach(s => { const X = s * w, a = prP(X, fl, z), b = prP(X, .55, z), c = prP(X, .55, z + .85), d = prP(X, fl, z + .85), fade = Math.max(.05, 1 - z / zf) * lit; q([a, b, c, d], L(8 + 30 * fade)); const wa = prP(X, .1, z + .2), wb = prP(X, .45, z + .2), wc = prP(X, .45, z + .55), wd = prP(X, .1, z + .55); q([wa, wb, wc, wd], `rgba(0,0,0,${(.6 + .3 * (1 - fade)).toFixed(2)})`);
    if (i === 2 && s === 1 && o.door) { const op = o.door; q([a, b, prP(X - op * .7, .55, z + .1), prP(X - op * .7, fl, z + .1)], '#020302'); } }));
  /* le fond : une porte ouverte sur le noir */
  const e1 = prP(-.45, fl, zf), e2 = prP(.45, .75, zf); g.fillStyle = '#000'; g.fillRect(e1[0], e2[1], e2[0] - e1[0], e1[1] - e2[1]);
  /* néons */
  [1.6, 3.6, 6, 8.8].forEach((z, i) => { const on = lit * (i === 1 ? (o.flick == null ? 1 : o.flick) : 1); const a = prP(-.22, ce - .01, z), b = prP(.22, ce - .01, z + 1.1); g.fillStyle = `rgba(225,240,225,${(.15 + .8 * on * Math.max(.2, 1 - z / zf)).toFixed(2)})`; g.fillRect(Math.min(a[0], b[0]), a[1], Math.abs(b[0] - a[0]) || 2, Math.max(2, (b[1] - a[1]) * .25 + 3));
    if (on > .1) { const cx = (a[0] + b[0]) / 2, cy = a[1] + 14, r = 260 / z, hg = g.createRadialGradient(cx, cy, 0, cx, cy, r); hg.addColorStop(0, `rgba(210,235,210,${(.16 * on).toFixed(3)})`); hg.addColorStop(1, 'rgba(210,235,210,0)'); g.fillStyle = hg; g.fillRect(cx - r, cy - r, r * 2, r * 2); } });
}
/* la silhouette */
function prFigure(g, t, z, o = {}) {
  if (z <= .3) return; const base = prP(0, PRV.fl, z), top = prP(0, PRV.fl + 1.85, z), H = base[1] - top[1], sw = Math.sin(t * .7) * H * .006, cx = base[0] + (o.dx || 0) / z * PRV.F;
  g.save(); g.fillStyle = `rgba(0,0,0,${o.a == null ? .96 : o.a})`;
  /* corps long et maigre */
  g.beginPath(); g.moveTo(cx - H * .07, base[1]); g.lineTo(cx - H * .095 + sw, top[1] + H * .22); g.quadraticCurveTo(cx + sw, top[1] + H * .16, cx + H * .095 + sw, top[1] + H * .22); g.lineTo(cx + H * .07, base[1]); g.closePath(); g.fill();
  /* bras trop longs */
  g.lineWidth = Math.max(1, H * .022); g.strokeStyle = g.fillStyle; g.lineCap = 'round';
  g.beginPath(); g.moveTo(cx - H * .09 + sw, top[1] + H * .24); g.quadraticCurveTo(cx - H * .13, top[1] + H * .55, cx - H * .11, top[1] + H * .8); g.moveTo(cx + H * .09 + sw, top[1] + H * .24); g.quadraticCurveTo(cx + H * .13, top[1] + H * .55, cx + H * .115, top[1] + H * .82); g.stroke();
  /* tête penchée */
  g.beginPath(); g.ellipse(cx + sw * 2 + H * .01, top[1] + H * .1, H * .055, H * .085, .18, 0, 6.2832); g.fill();
  /* deux points pâles */
  if (o.eyes !== false) { const ex = cx + sw * 2 + H * .01, ey = top[1] + H * .09, ea = o.eyes == null ? .55 : o.eyes; g.fillStyle = `rgba(230,240,230,${ea})`; g.beginPath(); g.arc(ex - H * .02, ey, Math.max(.6, H * .007), 0, 6.2832); g.arc(ex + H * .02, ey + H * .004, Math.max(.6, H * .007), 0, 6.2832); g.fill(); }
  g.restore();

/* ===== Radar : fond Esri + radar LibreWXR/RainViewer + foudre Blitzortung ===== */
let map = null, frames = [], fi = 0, rplay = true, LP = cfg.rain, LO = cfg.bolt, hold = 0, liveIdx = 0, radarKey = '', boltLayer = null, radarStarted = false, lastRadar = 0;
const strikes = [], rg = $('rg');
const setPlay = () => { $('pi').innerHTML = rplay ? '<path d="M8 5v14M16 5v14"/>' : '<path d="M7 5l12 7-12 7z" fill="currentColor"/>'; }; setPlay();
$('cp').classList.toggle('on', LP); $('cl').classList.toggle('on', LO);
const PROV = [
  {n: 'LibreWXR', u: 'https://api.librewxr.net/public/weather-maps.json', c: 6, q: '?cells=light', z: 10, g: 'linear-gradient(90deg,#2fd05a,#e8e03a,#f08a24,#e02828)'},
  {n: 'RainViewer', u: 'https://api.rainviewer.com/public/weather-maps.json', c: 2, q: '', z: 7, g: 'linear-gradient(90deg,#8fd3ff,#2f8cff,#1b3dd6,#fff)'}
];
function initMap() {
  if (!window.L) { $('tl').textContent = 'Carte indisponible'; return; }
  map = L.map('map', {zoomControl: false, minZoom: 5, maxZoom: 10, zoomSnap: 1, preferCanvas: true, fadeAnimation: false, markerZoomAnimation: false, wheelDebounceTime: 80}).setView([LAT, LON], +cfg.zoom || 7);
  map.attributionControl.setPrefix(false); L.control.zoom({position: 'topright'}).addTo(map);
  const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';
  const base = L.layerGroup([L.tileLayer(ESRI + 'World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {maxNativeZoom: 16, maxZoom: 19, zIndex: 1, attribution: 'Fond © Esri, HERE, Garmin, © OpenStreetMap · Radar LibreWXR / RainViewer · Foudre Blitzortung'}), L.tileLayer(ESRI + 'World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {maxNativeZoom: 16, maxZoom: 19, zIndex: 8})]).addTo(map);
  let bad = 0, good = 0;
  base.getLayers()[0].on('tileload', () => good++).on('tileerror', () => { if (++bad >= 4 && !good) { map.removeLayer(base); L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, zIndex: 1, className: 'osmdark', attribution: '© OpenStreetMap contributors · Radar LibreWXR / RainViewer · Foudre Blitzortung'}).addTo(map); } });
  [50, 100].forEach(km => L.circle([LAT, LON], {radius: km * 1000, color: '#fff', weight: 1, opacity: .3, dashArray: '4 6', fill: false, interactive: false}).addTo(map));
  L.marker([LAT, LON], {icon: L.divIcon({className: '', html: '<div class="me"></div>', iconSize: [14, 14]}), keyboard: false}).bindTooltip(cfg.name.split('·')[0].trim(), {permanent: true, direction: 'right', offset: [10, 0], className: 'tt'}).addTo(map);
  boltLayer = L.layerGroup(); if (LO) boltLayer.addTo(map);
}
const tileXY = z => { const n = 2 ** z, r = Math.PI / 180; return [Math.floor((LON + 180) / 360 * n), Math.floor((1 - Math.log(Math.tan(LAT * r) + 1 / Math.cos(LAT * r)) / Math.PI) / 2 * n)]; };
const probe = url => new Promise(res => { const im = new Image(); im.onload = () => res(true); im.onerror = () => res(false); im.src = url; setTimeout(() => res(false), 8000); });
async function loadRadar() {
  if (!map) return; lastRadar = Date.now();
  for (const p of PROV) {
    try {
      const r = await fetch(p.u); if (!r.ok) continue;
      const j = await r.json(), q = Math.max(3, +cfg.radarQ || 8), past = ((j.radar && j.radar.past) || []).slice(-q), nc = ((j.radar && j.radar.nowcast) || []).slice(0, 3); if (!past.length) continue;
      const key = p.n + past[past.length - 1].time + nc.length; if (key === radarKey) return;
      const mk = x => `${j.host}${x.path}/256/{z}/{x}/{y}/${p.c}/1_1.png${p.q}`, [tx, ty] = tileXY(5);
      if (!await probe(mk(past[past.length - 1]).replace('{z}', 5).replace('{x}', tx).replace('{y}', ty))) continue;
      radarKey = key; frames.forEach(x => map.removeLayer(x.layer));
      frames = past.map(a => [a, 0]).concat(nc.map(a => [a, 1])).map(a => ({time: a[0].time, nc: a[1], layer: L.tileLayer(mk(a[0]), {opacity: 0, maxNativeZoom: p.z, maxZoom: 10, zIndex: 5, className: 'rd', updateWhenIdle: true, updateWhenZooming: false, keepBuffer: 0}).addTo(map)}));
      liveIdx = past.length - 1; rg.max = frames.length - 1; $('leg').innerHTML = `Radar ${p.n} <b style="background:${p.g}"></b>`; showFrame(liveIdx); return;
    } catch (e) {}
  }
  $('tl').textContent = 'Radar indisponible';
}
function showFrame(i) {
  if (!frames.length) return; const prev = fi; fi = i; rg.value = i; if (frames[prev] && prev !== i) frames[prev].layer.setOpacity(0); frames[i].layer.setOpacity(LP ? .8 : 0);
  const q = frames[i], hh = new Date(q.time * 1000).toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'});
  $('tl').textContent = q.nc ? hh + ' · prévision' : i === liveIdx ? hh + ' · live' : hh + ' · −' + Math.round((frames[liveIdx].time - q.time) / 60) + ' min';
}
$('play').onclick = () => { rplay = !rplay; setPlay(); };
rg.oninput = () => { rplay = false; setPlay(); showFrame(+rg.value); };
$('cp').onclick = e => { LP = !LP; e.currentTarget.classList.toggle('on', LP); showFrame(fi); };
$('cl').onclick = e => { LO = !LO; e.currentTarget.classList.toggle('on', LO); if (map) LO ? boltLayer.addTo(map) : map.removeLayer(boltLayer); };
setInterval(() => { if (document.hidden || view !== 2 || !rplay || frames.length < 2) return; if (fi === frames.length - 1 && hold++ < 3) return; hold = 0; showFrame((fi + 1) % frames.length); }, 650);

/* Foudre : Blitzortung (flux communautaire non officiel) */
function lzw(b) { let a, e = {}, d = b.split(''), c = d[0], g = c, o = [c], h = 256, n = h; for (let i = 1; i < d.length; i++) { a = d[i].charCodeAt(0); a = h > a ? d[i] : e[a] ? e[a] : g + c; o.push(a); c = a.charAt(0); e[n] = g + c; n++; g = a; } return o.join(''); }
const km = (la, lo) => { const r = Math.PI / 180, x = (la - LAT) * r, y = (lo - LON) * r, a = Math.sin(x / 2) ** 2 + Math.cos(LAT * r) * Math.cos(la * r) * Math.sin(y / 2) ** 2; return 12742 * Math.asin(Math.sqrt(a)); };
function addStrike(la, lo) { if (!map || Math.abs(la - LAT) > 4 || Math.abs(lo - LON) > 6) return; const m = L.circleMarker([la, lo], {radius: 4, color: '#fff3a0', weight: 1, fillColor: '#ffd21f', fillOpacity: 1, interactive: false}).addTo(boltLayer); strikes.push({t: Date.now(), d: km(la, lo), m}); if (strikes.length > 250) boltLayer.removeLayer(strikes.shift().m); }
let ws, wsOk = false, wsN = 0;
function connectWS() { try { ws = new WebSocket(`wss://ws${[1, 7, 8, 3][wsN++ % 4]}.blitzortung.org/`); ws.onopen = () => { wsOk = true; ws.send('{"a":111}'); }; ws.onmessage = e => { try { const d = JSON.parse(lzw(e.data)); addStrike(d.lat, d.lon); } catch (_) {} }; ws.onerror = () => ws.close(); ws.onclose = () => { wsOk = false; setTimeout(connectWS, 6000); }; } catch (_) { setTimeout(connectWS, 10000); } }
function ageStrikes() {
  const now = Date.now(); while (strikes.length && now - strikes[0].t > 30 * 60000) boltLayer.removeLayer(strikes.shift().m);
  if (view === 2) strikes.forEach(s => { const a = (now - s.t) / 60000; s.m.setStyle({fillOpacity: Math.max(.25, 1 - a / 30), opacity: Math.max(.2, 1 - a / 30)}); });
  $('cl').textContent = wsOk ? 'Orages · ' + strikes.filter(s => s.d <= 100).length : 'Orages'; updAlert();
}
function updAlert() { const now = Date.now(), near = strikes.filter(s => now - s.t < 15 * 60000 && s.d <= 50).map(s => s.d); $('al').textContent = near.length ? `⚡ Foudre à ${Math.round(Math.min(...near))} km` : stormAt ? `⚡ Orage prévu vers ${stormAt}` : ''; }

/* ===== Synchronisation avec la page admin (réseau local) =====
   L'ESP32 expose GET/POST /api/config. Hors ESP32, repli sur le même navigateur (localStorage). */
async function sync() {
  let j = null;
  try { const r = await fetch(BASE + '/api/config?t=' + Date.now() + '&c=' + CID, {cache: 'no-store'}); if (r.ok) j = await r.json(); } catch (e) {}
  if (!j || !j.v) { try { j = JSON.parse(localStorage.getItem('meteoCfgPush') || 'null'); } catch (e) {} }
  applyRemote(j);
}
/* L'image de la mascotte n'est envoyée qu'une fois : ensuite l'admin envoie seulement « img:empreinte » */
function mascResolve(j, old) {
  const m = j && j.masc; if (!m || !m.src) return;
  try {
    if (/^data:/.test(m.src)) localStorage.setItem('mascImg', JSON.stringify({h: imgHash(m.src), src: m.src}));
    else if (/^img:/.test(m.src)) { const h = m.src.slice(4), c = JSON.parse(localStorage.getItem('mascImg') || 'null'), o = old && old.masc && old.masc.src; m.src = c && c.h === h ? c.src : o && /^data:/.test(o) && imgHash(o) === h ? o : ''; }
  } catch (e) {}
}
/* Ce que l'écran affiche vraiment (pour le diagnostic dans l'admin) */
function scrInfo() {
  const want = cfg.hud, hud = HT.id; let why = '';
  if (hud !== want) { const p = pickTheme(), fe = p && p.ev && FESTHUD[p.ev.id]; why = QS.get('hud') ? 'url' : fe === hud ? 'fest:' + p.ev.name : (typeof rollHud === 'function' && rollHud() === hud) ? 'roll' : !SIG[want] && !HUDS.find(x => x[0] === want) ? 'unknown' : 'other'; }
  return {app: APPV, hud, want, why, city: typeof GEO !== 'undefined' && GEO && cfg.geo !== false ? GEO.city : ''};
}
function applyRemote(j) {
  if (!j || !j.v || +j.v <= +lastV) return;   // ignore les anciennes configs (rejouées par le relais au démarrage)
  lastV = j.v; const old = cfg; mascResolve(j, old); cfg = norm(Object.assign({}, DEF, j));
  if (!PV) try { localStorage.setItem('meteoCfgCache', JSON.stringify(cfg)); } catch (e) {}
  if (+cfg.lat !== +old.lat || +cfg.lon !== +old.lon || +cfg.zoom !== +old.zoom || (cfg.geo !== false) !== (old.geo !== false)) { location.reload(); return; }
  applyCfg(); resched();
  if (cfg.notice && cfg.notice.id && cfg.notice.id !== lastNotice) { lastNotice = cfg.notice.id; if (!firstSync) showNotice(cfg.notice); }
  if (cfg.fire && cfg.fire.id && cfg.fire.id !== lastFire) { lastFire = cfg.fire.id; if (!firstSync && Math.abs(Date.now() - cfg.fire.id) < 600000) setTimeout(() => runEgg(cfg.fire.egg), 400); }   // test d'un easter egg depuis l'admin
  firstSync = false;
}

/* ===== Appairage direct entre PC (WebRTC via PeerJS) : aucun serveur à installer =====
   Cet écran s'enregistre sous le code d'appairage ; la page admin se connecte avec ce code. */
const CH = 'abcdefghjkmnpqrstuvwxyz23456789';
let CODE = (new URLSearchParams(location.search).get('code') || localStorage.getItem('pairCode') || '').toLowerCase();
if (!CODE) CODE = Array.from({length: 8}, () => CH[Math.random() * CH.length | 0]).join('');
if (!PV) try { localStorage.setItem('pairCode', CODE); } catch (e) {}
/* ===== Relais web (ntfy.sh) : relie n'importe quels navigateurs / PC, même derrière des pare-feux =====
   Les messages sont compressés, découpés et publiés sur un « sujet » secret dérivé du code d'appairage. */
const NTFY = 'https://ntfy.sh/';
const topic = (code, side) => 'meteohud-' + code + '-' + side;   // s = écran, a = admin
async function pack(obj) {
  const j = JSON.stringify(obj);
  try { if (window.CompressionStream) { const buf = new Uint8Array(await new Response(new Blob([j]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer()); let b = ''; buf.forEach(x => b += String.fromCharCode(x)); return 'z' + btoa(b); } } catch (e) {}
  return 'j' + btoa(unescape(encodeURIComponent(j)));
}
async function unpack(t) {
  if (t[0] === 'z') { const bin = atob(t.slice(1)), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return JSON.parse(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text()); }
  return JSON.parse(decodeURIComponent(escape(atob(t.slice(1)))));
}
async function relaySend(top, obj) {
  const p = await pack(obj), id = Date.now().toString(36) + Math.random().toString(36).slice(2, 5), N = 3200, n = Math.ceil(p.length / N);
  for (let i = 0; i < n; i++) { const r = await fetch(NTFY + top, {method: 'POST', body: id + '.' + i + '.' + n + '.' + p.slice(i * N, (i + 1) * N)}); if (!r.ok) throw new Error('relais ' + r.status); }
}
function relaySub(top, since, onObj, onState) {
  const bufs = {}; let es = new EventSource(NTFY + top + '/sse' + (since ? '?since=' + since : ''));
  es.onopen = () => onState && onState(true);
  es.onerror = () => onState && onState(false);   // EventSource se reconnecte tout seul
  es.onmessage = async ev => {
    try {
      const d = JSON.parse(ev.data); if (d.event !== 'message') return;
      const a = d.message.split('.'), id = a[0], i = +a[1], n = +a[2]; (bufs[id] = bufs[id] || {})[i] = a.slice(3).join('.');
      if (Object.keys(bufs[id]).length === n) { let t = ''; for (let k = 0; k < n; k++) t += bufs[id][k]; delete bufs[id]; onObj(await unpack(t)); }
    } catch (e) {}
  };
  return {close: () => es.close()};
}
let peer, pt, p2pOk = false, relayOk = false;
const pairTxt = () => 'Code : ' + CODE + '  ·  P2P ' + (p2pOk ? '✓' : '…') + '  ·  relais ' + (relayOk ? '✓' : '…');
const updPair = () => { const e = $('pair'); if (e.classList.contains('on')) e.textContent = pairTxt(); };
function showPair(txt, sec) { const e = $('pair'); e.textContent = txt || pairTxt(); e.classList.add('on'); clearTimeout(pt); if (sec) pt = setTimeout(() => e.classList.remove('on'), sec * 1000); }
$('city').onclick = () => $('pair').classList.contains('on') ? $('pair').classList.remove('on') : showPair();
function startPeer() {
  if (!window.Peer) return;
  peer = new Peer('meteoscr-' + CODE);
  peer.on('open', () => { p2pOk = true; updPair(); });
  peer.on('connection', c => {
    c.on('open', () => showPair('Admin connecté ✓', 6));
    c.on('data', m => {
      if (!m) return;
      if (m.type === 'get') c.send(Object.assign({type: 'config', cfg: cfg}, scrInfo()));
      else if (m.type === 'config' && m.cfg && m.cfg.v) { applyRemote(m.cfg); setTimeout(() => c.send(Object.assign({type: 'ack', v: m.cfg.v}, scrInfo())), 300); }
    });
  });
  peer.on('disconnected', () => { p2pOk = false; updPair(); });
  peer.on('disconnected', () => setTimeout(() => { try { peer.reconnect(); } catch (e) {} }, 3000));
  peer.on('error', e => { if (e.type === 'unavailable-id' || e.type === 'network' || e.type === 'server-error') setTimeout(() => { try { peer.destroy(); } catch (x) {} startPeer(); }, 6000); });
}

/* ===== Démarrage ===== */
function fit() { const s = Math.min(innerWidth / 800, innerHeight / 480); stage.style.transform = `translate(${(innerWidth - 800 * s) / 2}px,${(innerHeight - 480 * s) / 2}px) scale(${s})`; }
addEventListener('resize', fit); fit();
let skipB = false; try { skipB = sessionStorage.getItem('skipBoot') === '1'; sessionStorage.removeItem('skipBoot'); } catch (e) {}
if (!PV && !QS.get('noboot') && !skipB) runBoot();
let wInt; function resched() { clearInterval(wInt); wInt = setInterval(loadWeather, Math.max(2, +cfg.refresh || 10) * 60000); }
rollLucky(); if (!PV) initMap(); applyCfg(); show(PV ? 1 : cfg.view === 'radar' && cfg.tabs.radar ? 2 : cfg.view === 'infos' && cfg.tabs.infos ? 3 : 1);
requestAnimationFrame(fx); loadWeather(); resched(); setInterval(() => { if (view === 2 && radarStarted) loadRadar(); }, 5 * 60000);
if (QS.get('egg')) setTimeout(() => runEgg(QS.get('egg')), 1800);
if (PV) {
  /* Aperçu : page météo seule, sans radar ni liaison réseau ; la config arrive du panel admin */
  stage.classList.add('pv');
  addEventListener('message', e => {
    const d = e.data; if (!d) return;
    if (d.type === 'preview-egg' && d.egg) { eggBusy = 0; runEgg(d.egg); return; }
    if (d.type !== 'preview-config' || !d.cfg) return;
    const moved = +d.cfg.lat !== LAT || +d.cfg.lon !== LON;
    cfg = norm(Object.assign({}, DEF, d.cfg)); LAT = +cfg.lat; LON = +cfg.lon;
    applyCfg(); if (moved) loadWeather();
  });
  try { parent.postMessage({type: 'preview-ready'}, '*'); } catch (e) {}
} else {
connectWS(); setInterval(ageStrikes, 5000);
startPeer(); showPair(null, 180);
/* Relais : reçoit la config même si l'écran était éteint (messages conservés 12 h).
   Au démarrage, le relais renvoie TOUTES les configs des 12 dernières heures : on attend la fin
   de la rafale et on n'applique que la plus récente (sinon tous les anciens thèmes défilent). */
let rPend = null, rT = 0;
function relayCfg(c) {
  if (!rPend || +c.v > +rPend.v) rPend = c;
  clearTimeout(rT); rT = setTimeout(() => { const c2 = rPend; rPend = null; const before = lastV; applyRemote(c2); if (lastV !== before) setTimeout(() => relaySend(topic(CODE, 'a'), Object.assign({type: 'ack', v: c2.v}, scrInfo())).catch(() => {}), 300); }, 700);
}
try {
  relaySub(topic(CODE, 's'), '12h', m => {
    if (!m) return;
    if (m.type === 'config' && m.cfg && m.cfg.v) relayCfg(m.cfg);
    else if (m.type === 'get' && Math.abs(Date.now() - m.t) < 300000) relaySend(topic(CODE, 'a'), Object.assign({type: 'config', cfg: cfg}, scrInfo())).catch(() => {});
    else if (m.type === 'ping' && Math.abs(Date.now() - m.t) < 300000) relaySend(topic(CODE, 'a'), Object.assign({type: 'pong', name: cfg.name, v: lastV}, scrInfo())).catch(() => {});
  }, ok => { relayOk = ok; updPair(); });
} catch (e) {}
sync().then(() => { firstSync = false; }); setInterval(sync, 4000);
}
</script>
