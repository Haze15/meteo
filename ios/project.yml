name: Meteo
options:
  bundleIdPrefix: fr.haze15
  deploymentTarget:
    iOS: "15.0"
targets:
  Meteo:
    type: application
    platform: iOS
    sources: [Meteo]
    dependencies:
      - target: MeteoWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.haze15.meteo
        PRODUCT_NAME: Meteo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Météo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
  MeteoWidget:
    type: app-extension
    platform: iOS
    sources: [MeteoWidget]
    deploymentTarget: "16.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.haze15.meteo.widget
        PRODUCT_NAME: MeteoWidget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Météo
        INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
